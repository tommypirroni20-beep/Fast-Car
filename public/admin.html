<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fast Car Gestionale</title>
<style>body{font-family:Arial;margin:0;background:#f5f7fa}.top{background:#111;color:#fff;padding:20px}.wrap{max-width:1100px;margin:30px auto;padding:15px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.box,table{background:#fff;padding:20px;border-radius:12px}.num{font-size:28px;font-weight:800}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}@media(max-width:700px){.cards{grid-template-columns:1fr}table{font-size:12px}}</style></head>
<body><div class="top"><strong>FAST CAR — GESTIONALE</strong></div><div class="wrap"><div class="cards"><div class="box">Prenotazioni<div class="num" id="count">0</div></div><div class="box">Incasso<div class="num" id="revenue">€0</div></div><div class="box">Margine<div class="num" id="margin">€0</div></div></div>
<table><thead><tr><th>ID</th><th>Cliente</th><th>Auto</th><th>Prezzo</th><th>Costo partner</th><th>Margine</th><th>Stato</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>fetch("/api/bookings").then(r=>r.json()).then(bs=>{count.textContent=bs.length;revenue.textContent="€"+bs.reduce((a,b)=>a+b.customerPrice,0);margin.textContent="€"+bs.reduce((a,b)=>a+b.margin,0);rows.innerHTML=bs.map(b=>`<tr><td>${b.id}</td><td>${b.name}</td><td>${b.car}</td><td>€${b.customerPrice}</td><td>€${b.customerPrice-b.margin}</td><td>€${b.margin}</td><td>${b.status}</td></tr>`).join("")})</script></body></html>
