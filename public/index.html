<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fast Car — Prenota</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#111}
header{background:#111;color:#fff;padding:20px 7%;display:flex;justify-content:space-between}
main{max-width:900px;margin:40px auto;padding:20px}
.card{background:#fff;padding:30px;border-radius:18px;box-shadow:0 8px 30px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{font-weight:700;display:block;margin:8px 0}
input,select,button{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:10px}
button{background:#111;color:#fff;font-weight:700;border:0;margin-top:18px;cursor:pointer}
.price{font-size:34px;font-weight:800;margin-top:20px}
.msg{margin-top:15px;font-weight:700}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>
<strong>FAST CAR</strong>
<span>Cagliari & dintorni</span>
</header>

<main>
<div class="card">

<h1>Prenota la tua auto</h1>

<form id="bookingForm">

<div class="grid">

<div>
<label for="start">Ritiro</label>
<input id="start" type="date" required>
</div>

<div>
<label for="end">Riconsegna</label>
<input id="end" type="date" required>
</div>

<div>
<label for="car">Auto</label>
<select id="car" required>
<option value="">Seleziona un'auto</option>
<option value="economy">Economy — €400 / settimana</option>
<option value="compact">Compact — €470 / settimana</option>
<option value="suv">SUV — €570 / settimana</option>
</select>
</div>

<div>
<label for="name">Nome</label>
<input id="name" type="text" placeholder="Mario Rossi" required>
</div>

<div>
<label for="email">Email</label>
<input id="email" type="email" placeholder="nome@email.it" required>
</div>

</div>

<div class="price">€ <span id="price">—</span></div>

<p>Il prezzo mostrato è il prezzo Fast Car.</p>

<button type="submit">Continua al pagamento</button>

<div class="msg" id="msg"></div>

</form>
</div>
</main>

<script>

const form = document.getElementById("bookingForm");
const car = document.getElementById("car");
const price = document.getElementById("price");
const msg = document.getElementById("msg");

const prices = {
  economy: 400,
  compact: 470,
  suv: 570
};

car.addEventListener("change", function() {
  price.textContent = prices[car.value] || "—";
});

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  msg.textContent = "";

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const start = document.getElementById("start").value;
  const end = document.getElementById("end").value;
  const carKey = document.getElementById("car").value;

  if (!name || !email || !start || !end || !carKey) {
    msg.textContent = "Compila tutti i campi.";
    return;
  }

  if (end <= start) {
    msg.textContent = "La riconsegna deve essere successiva al ritiro.";
    return;
  }

  msg.textContent = "Apertura pagamento...";

  try {

    const response = await fetch("/api/create-checkout", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name: name,
        email: email,
        start: start,
        end: end,
        carKey: carKey
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Errore del server");
    }

    if (data.url) {
      window.location.href = data.url;
      return;
    }

    if (data.demo) {
      msg.textContent = "Prenotazione salvata. Stripe non è ancora configurato.";
      return;
    }

    throw new Error("Stripe non ha restituito il link di pagamento.");

  } catch (error) {

    msg.textContent = error.message;

  }

});

</script>

</body>
</html>
