<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fast Car — Prenota</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#111}
header{background:#111;color:#fff;padding:20px 7%;display:flex;justify-content:space-between}
main{max-width:900px;margin:40px auto;padding:20px}
.card{background:#fff;padding:30px;border-radius:18px;box-shadow:0 8px 30px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{font-weight:700;display:block;margin:8px 0}
input,select,button{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:10px}
button{background:#111;color:#fff;font-weight:700;border:0;margin-top:18px;cursor:pointer}
.price{font-size:34px;font-weight:800;margin-top:20px}
.msg{margin-top:15px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><strong>FAST CAR</strong><span>Cagliari & dintorni</span></header>

<main>
<div class="card">
<h1>Prenota la tua auto</h1>

<div class="grid">
<div><label for="start">Ritiro</label><input id="start" type="date"></div>
<div><label for="end">Riconsegna</label><input id="end" type="date"></div>

<div>
<label for="car">Auto</label>
<select id="car">
<option value="">Seleziona un'auto</option>
<option value="economy">Economy — €400 / settimana</option>
<option value="compact">Compact — €470 / settimana</option>
<option value="suv">SUV — €570 / settimana</option>
</select>
</div>

<div><label for="name">Nome</label><input id="name" placeholder="Mario Rossi"></div>
<div><label for="email">Email</label><input id="email" type="email" placeholder="nome@email.it"></div>
</div>

<div class="price">€ <span id="price">—</span></div>
<p>Il prezzo mostrato è il prezzo Fast Car.</p>

<button id="pay">Continua al pagamento</button>
<div class="msg" id="msg"></div>
</div>
</main>

<script>
const cars = {
  economy: {name:"Economy", sell:400},
  compact: {name:"Compact", sell:470},
  suv: {name:"SUV", sell:570}
};

const carEl = document.getElementById("car");
const priceEl = document.getElementById("price");
const msg = document.getElementById("msg");

function updatePrice() {
  const car = cars[carEl.value];
  priceEl.textContent = car ? car.sell : "—";
}

carEl.addEventListener("change", updatePrice);
updatePrice();

document.getElementById("pay").addEventListener("click", async () => {
  msg.textContent = "";

  const body = {
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    start: document.getElementById("start").value,
    end: document.getElementById("end").value,
    carKey: carEl.value
  };

  if (!body.name || !body.email || !body.start || !body.end || !body.carKey) {
    msg.textContent = "Compila tutti i campi e scegli un'auto.";
    return;
  }

  try {
    msg.textContent = "Attendi...";
    const response = await fetch("/api/create-checkout", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body)
    });

    const data = await response.json();

    if (data.url) {
      window.location.href = data.url;
    } else {
      msg.textContent = data.message || data.error || "Errore durante la prenotazione.";
    }
  } catch (error) {
    msg.textContent = "Errore di connessione. Riprova.";
  }
});
</script>
</body>
</html>
